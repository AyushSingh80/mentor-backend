services:
  - type: web
    name: upsc-mentor-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_BEARER_TOKEN
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: MONTHLY_USD_CAP
        value: "30"
      - key: DAILY_REQUEST_CAP
        value: "120"
      - key: MCQ_MONTHLY_USD_CAP
        value: "8"
      - key: CA_MONTHLY_USD_CAP
        value: "5"
      - key: DRILLS_MONTHLY_USD_CAP
        value: "4"
      - key: INTERVIEW_MONTHLY_USD_CAP
        value: "2"
      - key: EVAL_RESERVED_FLOOR_USD
        value: "10"
      - key: PRICE_BULK_INPUT_PER_MTOK
        value: "0"
      - key: PRICE_BULK_OUTPUT_PER_MTOK
        value: "0"
