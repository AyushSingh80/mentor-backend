# Render deployment, free tier.
#
# Chosen for one reason: no billing account anywhere in the stack. You cannot be
# surprised by an infrastructure bill because no payment method exists to charge.
# The cost is a cold start of 30-60 seconds after 15 minutes idle — which this
# app absorbs better than most, because every endpoint is PULLED rather than
# pushed and the phone works offline without any of them.
#
# See DEPLOYMENT.md for the alternatives and why they were not chosen.

services:
  - type: web
    name: upsc-mentor-server
    runtime: node
    plan: free
    region: singapore # Closest of Render's free regions to India.
    rootDir: server
    buildCommand: npm ci && npm run build
    # `npm run build` is not optional and not just tsc: it copies the rubric,
    # MCQ, current-affairs, drill and interview PROMPT FILES into dist/. The
    # server asserts they compiled before it binds a port, so a build that skips
    # the copy fails its health check rather than failing on the first paid
    # request of the month. That guard is already written; this is what feeds it.
    startCommand: npm start

    healthCheckPath: /health

    # ONE instance, and this is a correctness requirement rather than a cost one.
    # `tryReserve` and `releaseReservation` in usage.ts are read-modify-write
    # against a single document with no compare-and-swap. Two instances can each
    # read $20 spent, each reserve $8, and each write back $28 — recording $36 of
    # real spend as $28. The free plan gives one instance anyway; this states it
    # so a later plan change cannot silently break the ledger.
    numInstances: 1

    envVars:
      - key: NODE_ENV
        value: production
        # Load-bearing: index.ts REFUSES to start with EVAL_RUNNER=fake when
        # NODE_ENV is production, so a fake runner can never serve invented
        # marks to a real study session. An outage is obvious; invented scores
        # are trusted.

      - key: APP_BEARER_TOKEN
        generateValue: true
        # Generated by Render and never in this file. Read it from the dashboard
        # once and put it in the app; it is the only credential the phone holds.

      # --- Secrets. Set these in the Render dashboard, never here. ---
      # sync: false means "prompt me, do not store a value in the repo".
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

      # --- Models. Absent means that tier answers 503 rather than degrading. ---
      - key: PROVIDER_EVALUATION
        value: gemini
      - key: MODEL_EVALUATION
        sync: false
      - key: PROVIDER_BULK
        value: groq
      - key: MODEL_BULK
        sync: false

      - key: APP_TIMEZONE
        value: Asia/Kolkata
        # Day and month boundaries for the spend caps are computed in this zone.
        # A UTC day rolls over at 05:30 IST — mid morning study block — which
        # would reset the daily cap at exactly the wrong moment.

      # --- Spend caps. The real budget, asserted coherent at boot. ---
      - key: MONTHLY_USD_CAP
        value: "30"
      - key: DAILY_REQUEST_CAP
        value: "120"
      - key: MCQ_MONTHLY_USD_CAP
        value: "8"
      - key: CA_MONTHLY_USD_CAP
        value: "5"
      - key: DRILLS_MONTHLY_USD_CAP
        value: "4"
      - key: INTERVIEW_MONTHLY_USD_CAP
        value: "2"
      - key: EVAL_RESERVED_FLOOR_USD
        value: "10"

      # Free tier: zero is the honest number, and it keeps /usage reconcilable.
      # Never set a fake price to keep the dollar cap alive — that makes the
      # ledger describe spending that did not happen.
      - key: PRICE_BULK_INPUT_PER_MTOK
        value: "0"
      - key: PRICE_BULK_OUTPUT_PER_MTOK
        value: "0"

    # ---------------------------------------------------------------------
    # KNOWN GAP, read before enabling a paid provider.
    #
    # USAGE_FILE defaults to ./data/usage.json and Render's filesystem is
    # EPHEMERAL. Every redeploy and every cold start wipes it, so capStatus()
    # reports $0 spent and the $30 ceiling stops binding. The cap is the only
    # thing between a retry loop and a real bill.
    #
    # This is currently harmless because no paid provider is configured — Groq
    # and Gemini free tiers bill nothing, and PRICE_BULK_* are zero. It becomes
    # urgent the day a paid key is added.
    #
    # The fix is a LedgerStore port with a network adapter (Turso or Upstash),
    # about sixty lines. DEPLOYMENT.md Blocker 1 has the detail.
    # ---------------------------------------------------------------------
